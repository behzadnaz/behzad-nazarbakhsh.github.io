name: Build complete report pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'report-parts/**'
      - '.github/workflows/build-reports.yml'

permissions:
  contents: write

jobs:
  build-reports:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip report-build]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build standalone report pages
        shell: python
        run: |
          from pathlib import Path
          import re
          import zlib

          root = Path('.')
          parts_dir = root / 'report-parts'

          pieces = []
          for i in range(29):
              path = parts_dir / f'{i:02d}.html'
              data = path.read_bytes()
              if i in (0, 28):
                  piece = data.decode('utf-8')
              else:
                  # The compressed parts are stored as UTF-8 text whose code points
                  # represent the original byte values. Restore those bytes first.
                  encoded = data.decode('utf-8').encode('latin-1')
                  piece = zlib.decompress(encoded, -15).decode('utf-8')
              pieces.append(piece)

          source = ''.join(pieces)

          head_end = source.index('</head>') + len('</head>')
          ppm_start = source.index('<div class="view active" id="view-ppm"')
          ppm_end = source.index('</div><!-- /view-ppm -->', ppm_start) + len('</div><!-- /view-ppm -->')
          ocm_start = source.index('<div class="view" id="view-ocm"')
          ocm_end = source.index('</div>\n<!-- /view-ocm -->', ocm_start) + len('</div>\n<!-- /view-ocm -->')

          prefix = source[:head_end] + '\n<body>\n'
          common = source[ocm_end:]

          standalone_css = '''
          <style id="standalone-report-mode">
            .rtabs{display:none!important}
          </style>
          '''

          def build(start, end, title, active_id):
              html = (
                  prefix
                  + standalone_css
                  + source[start:end]
                  + '\n'
                  + common
              )
              marker = '</body>'
              script = f'''
          <script id="standalone-report-view">
          (function(){{
            function forceView(){{
              if(typeof showView === 'function') showView('{active_id}', false);
              document.title = {title!r};
            }}
            if(document.readyState === 'loading') {{
              document.addEventListener('DOMContentLoaded', forceView, {{once:true}});
            }} else {{
              forceView();
            }}
            setTimeout(forceView, 50);
          }})();
          </script>
          '''
              return html.replace(marker, script + '\n' + marker, 1)

          ppm = build(
              ppm_start, ppm_end,
              'IT Portfolio Management — Progress Report to the CIO',
              'view-ppm'
          )
          ocm = build(
              ocm_start, ocm_end,
              'Organization Change Management — Progress Report to the CIO',
              'view-ocm'
          )

          Path('IT-Portfolio-Management.html').write_text(ppm, encoding='utf-8')
          Path('Organization-Change-Management.html').write_text(ocm, encoding='utf-8')

          print('IT report:', len(ppm), 'bytes')
          print('OCM report:', len(ocm), 'bytes')

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IT-Portfolio-Management.html Organization-Change-Management.html
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "build: publish standalone report pages [skip report-build]"
            git push
          fi
