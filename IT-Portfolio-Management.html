<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Portfolio Management | Behzad Nazarbakhsh</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
html,body{margin:0;width:100%;min-height:100%;background:#fff}
#status{font:14px Arial,sans-serif;padding:24px;color:#555}
</style>
<style id="global-typography-v2">
/* Global typography hierarchy — applied after page-specific styles */
:root{--fs-body:16px;--fs-small:13px;--fs-label:11px;--fs-h1:clamp(3rem,5vw,4.25rem);--fs-h2:clamp(2rem,3.2vw,3rem);--fs-h3:1.3rem;--fs-h4:1.08rem}
html{font-size:16px!important}
body{font-size:16px!important;line-height:1.65!important}
p,li,dd,td{font-size:16px!important;line-height:1.65!important}
small{font-size:13px!important;line-height:1.5!important}
h1{font-size:var(--fs-h1)!important;line-height:1.08!important}
h2{font-size:var(--fs-h2)!important;line-height:1.15!important}
h3{font-size:1.3rem!important;line-height:1.25!important}
h4{font-size:1.08rem!important;line-height:1.3!important}
.nav-links,nav a,.button,.btn,.dlink,.pill{font-size:13px!important;line-height:1.4!important}
.section-label,.eyebrow,.hero-identity,.hero-badge,.hero-cap,.hero-meta,.report-number,.report-date,.report-link,.article-card span,footer{font-size:11px!important;line-height:1.4!important}
.article-card h3,.work-item strong,.expertise-grid h3,.report-card h2{font-size:1.3rem!important;line-height:1.25!important}
.article-card p,.expertise-grid p,.work-item small,.report-card p,.report-note{font-size:16px!important;line-height:1.65!important}
.hero-copy h1,.hero h1,.report-intro h1{font-size:var(--fs-h1)!important;line-height:1.08!important}

@media(max-width:560px){h1,.hero-copy h1,.hero h1,.report-intro h1{font-size:clamp(2.35rem,10vw,3rem)!important}h2{font-size:clamp(1.9rem,8.5vw,2.5rem)!important}}
</style><style id="global-typography-final">
/* Final site-wide typography — deliberately last in HEAD so page-specific styles do not override it */
html{font-size:16px!important}
body{font-size:16px!important;line-height:1.65!important}
p,li,dd,td{font-size:16px!important;line-height:1.65!important}
small{font-size:13px!important;line-height:1.5!important}
h1{font-size:clamp(3rem,5vw,4.25rem)!important;line-height:1.08!important}
h2{font-size:clamp(2rem,3.2vw,3rem)!important;line-height:1.15!important}
h3{font-size:1.3rem!important;line-height:1.25!important}
h4{font-size:1.08rem!important;line-height:1.3!important}
nav a,.dlink,.pill,.button,.btn{font-size:13px!important;line-height:1.4!important}
.eyebrow,.section-label,.hero-badge,.hero-cap,.hero-meta,.tbl th{font-size:11px!important;line-height:1.4!important;letter-spacing:.12em!important}
.hero h1{font-size:clamp(3rem,5vw,4.25rem)!important;line-height:1.08!important}
.hero .sub{font-size:16px!important;line-height:1.7!important}
.hero-kpis .hk b{font-size:1.3rem!important}
.hero-kpis .hk span{font-size:11px!important}
.fig figcaption,.src{font-size:13px!important;line-height:1.55!important}
@media(max-width:800px){h1,.hero h1{font-size:clamp(2.6rem,9vw,3.5rem)!important}h2{font-size:clamp(2rem,7vw,2.8rem)!important}h3{font-size:1.2rem!important}}
@media(max-width:560px){h1,.hero h1{font-size:clamp(2.35rem,10vw,3rem)!important}h2{font-size:clamp(1.9rem,8.5vw,2.5rem)!important}}
</style></head>
<body>
<div id="status">Loading IT Portfolio Management report…</div>
<script>
(async function(){
  const chunks=["report-parts/00.html","report-parts/01.html","report-parts/02.html","report-parts/03.html","report-parts/04.html","report-parts/05.html","report-parts/06.html","report-parts/07.html","report-parts/08.html","report-parts/09.html","report-parts/10.html","report-parts/11.html","report-parts/12.html","report-parts/13.html","report-parts/14.html","report-parts/15.html","report-parts/16.html","report-parts/17.html","report-parts/18.html","report-parts/19.html","report-parts/20.html","report-parts/21.html","report-parts/22.html","report-parts/23.html","report-parts/24.html","report-parts/25.html","report-parts/26.html","report-parts/27.html","report-parts/28.html"];
  try{
    const html=(await Promise.all(chunks.map(u=>fetch(u,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error("Failed to load "+u);return r.text()})))).join("");
    const doc=new DOMParser().parseFromString(html,"text/html");
    const target=doc.querySelector("#view-ppm");
    if(!target) throw new Error("IT Portfolio Management report content was not found");
    doc.querySelectorAll(".view").forEach(v=>{if(v!==target)v.remove()});
    doc.querySelectorAll(".rtabs").forEach(e=>e.remove());
    target.classList.add("active");
    target.removeAttribute("data-title");
    doc.title="IT Portfolio Management";
    document.open();
    document.write("<!DOCTYPE html>\n"+doc.documentElement.outerHTML);
    document.close();
  }catch(e){
    document.getElementById("status").textContent="Unable to load the report: "+e.message;
  }
})();
</script>
</body>
</html>
