<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT Portfolio Management — Progress Report to the CIO</title>
<style>body{margin:0;background:#fbfaf6;color:#12122b;font:16px/1.6 system-ui,sans-serif}#loading{min-height:100vh;display:grid;place-items:center}#loading div{padding:24px;text-align:center}</style>
</head>
<body>
<div id="loading"><div><strong>Loading IT Portfolio Management report…</strong><br><small>Preparing the report.</small></div></div>
<script>
(async function(){
  try{
    const res=await fetch('report-pages/ppm/report.html.gz',{cache:'no-store'});
    if(!res.ok) throw new Error('Report download failed ('+res.status+')');
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support compressed report loading.');
    const stream=res.body.pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div><strong>Unable to load the report.</strong><br><small>'+String(e.message||e)+'</small></div>';
  }
})();
</script>
</body>
</html>
