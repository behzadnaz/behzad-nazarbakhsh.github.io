    doc.head.appendChild(theme);
    const mainSiteTheme=document.createElement("link");
    mainSiteTheme.rel="stylesheet";
    mainSiteTheme.href="style.css?v=20260924";
    doc.head.appendChild(mainSiteTheme);
    doc.title="IT Portfolio Management";
    document.open();
    document.write("<!DOCTYPE html>\n"+doc.documentElement.outerHTML);
