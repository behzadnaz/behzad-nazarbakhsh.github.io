<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Behzad Nazarbakhsh — Software Craftsmanship, Product Coaching, Agile and IT Management.">
  <title>Behzad Nazarbakhsh | Professional Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
<style>
/* Homepage hero refinement */
.hero{
  min-height:94vh;
  padding-top:96px;
  padding-bottom:70px;
  background:
    radial-gradient(circle at 82% 42%,rgba(218,228,220,.72) 0,transparent 31%),
    linear-gradient(135deg,#fafbf8 0%,#eef2ed 100%);
}
.hero-grid{
  grid-template-columns:minmax(0,1fr) minmax(500px,.9fr);
  gap:34px;
  min-height:76vh;
  align-items:center;
}
.hero-copy{max-width:690px;padding-bottom:10px}
.hero-identity{
  margin:0 0 30px;
  font-family:"DM Mono",monospace;
  font-size:.72rem;
  font-weight:500;
  letter-spacing:.12em;
  color:var(--ink);
  text-transform:uppercase;
}
.hero-identity span{
  display:block;
  margin-top:9px;
  color:var(--muted);
  font-size:.67rem;
  letter-spacing:.05em;
  text-transform:none;
}
.hero-copy h1{
  max-width:700px;
  font-size:clamp(3.8rem,6.3vw,6.5rem);
  line-height:.98;
}
.hero-copy h1 em{display:inline-block;color:var(--ink)}
.hero-copy .intro{
  max-width:610px;
  margin-top:30px;
  margin-bottom:30px;
  font-size:1.02rem;
  line-height:1.75;
}
.hero-copy .actions{margin-top:4px}
.hero-copy .button{padding:11px 18px}
.hero-mark{
  justify-self:center;
  width:100%;
  transform:translateY(0);
}
.hero-thinking-map{margin:auto}
@media(max-width:1050px){
  .hero-grid{grid-template-columns:minmax(0,1fr) minmax(430px,.85fr);gap:12px}
  .hero-copy h1{font-size:clamp(3.4rem,6.5vw,5.4rem)}
}
@media(max-width:800px){
  .hero{min-height:auto;padding-top:90px;padding-bottom:65px}
  .hero-grid{grid-template-columns:1fr;gap:15px;min-height:auto}
  .hero-copy{max-width:700px}
  .hero-identity{margin-bottom:24px}
  .hero-copy h1{font-size:clamp(3.2rem,12vw,5rem)}
  .hero-copy .intro{font-size:1rem}
  .hero-mark{justify-self:center;margin-top:24px}
}
@media(max-width:560px){
  .hero{padding-top:82px}
  .hero-copy h1{font-size:clamp(2.8rem,13vw,4rem)}
  .hero-identity{font-size:.62rem;letter-spacing:.09em}
  .hero-identity span{font-size:.61rem}
  .hero-copy .intro{font-size:.94rem}
  .hero-mark{margin-top:12px}
}
</style>
<style>/* Final homepage typography balance */
.hero-copy h1{
  font-size:clamp(3.45rem,5.25vw,5.35rem);
  line-height:1.02;
  letter-spacing:-.045em;
  max-width:650px;
}
.hero-identity{
  margin-bottom:24px;
  font-size:.76rem;
  letter-spacing:.10em;
}
.hero-identity span{
  margin-top:7px;
  font-size:.72rem;
  letter-spacing:.02em;
}
.hero-copy .intro{
  max-width:560px;
  margin-top:24px;
  margin-bottom:27px;
  font-size:1rem;
  line-height:1.7;
}
.hero-copy .button{
  padding:10px 17px;
  font-size:.76rem;
}
@media(max-width:1050px){
  .hero-copy h1{font-size:clamp(3.2rem,5.6vw,4.7rem)}
}
@media(max-width:800px){
  .hero-copy h1{font-size:clamp(2.9rem,9.5vw,4.3rem)}
  .hero-copy .intro{font-size:.98rem}
}
@media(max-width:560px){
  .hero-copy h1{font-size:clamp(2.55rem,11vw,3.5rem)}
  .hero-identity{font-size:.68rem}
  .hero-identity span{font-size:.66rem}
  .hero-copy .intro{font-size:.94rem}
}
</style>
<style>
/* Final hero typography — calm, editorial scale */
.hero-copy h1{
  font-size:clamp(3.05rem,4.55vw,4.85rem);
  line-height:1.04;
  letter-spacing:-.038em;
  max-width:620px;
}
.hero-identity{
  margin-bottom:22px;
  font-size:.70rem;
  letter-spacing:.09em;
}
.hero-identity span{
  margin-top:6px;
  font-size:.68rem;
  letter-spacing:.015em;
}
.hero-copy .intro{
  max-width:540px;
  margin-top:22px;
  margin-bottom:26px;
  font-size:.96rem;
  line-height:1.72;
}
.hero-copy .button{
  padding:10px 16px;
  font-size:.73rem;
}
@media(max-width:1050px){
  .hero-copy h1{font-size:clamp(2.9rem,5vw,4.3rem)}
}
@media(max-width:800px){
  .hero-copy h1{font-size:clamp(2.75rem,9vw,4rem)}
  .hero-copy .intro{font-size:.95rem}
}
@media(max-width:560px){
  .hero-copy h1{font-size:clamp(2.45rem,10.5vw,3.35rem)}
  .hero-identity{font-size:.65rem}
  .hero-identity span{font-size:.63rem}
  .hero-copy .intro{font-size:.92rem}
}
</style>
<style>
/* Hero headline — reduce scale for a more refined balance */
.hero-copy h1{
  font-size:clamp(2.55rem,3.55vw,3.9rem);
  line-height:1.06;
  letter-spacing:-.032em;
  max-width:570px;
}
@media(max-width:1050px){
  .hero-copy h1{font-size:clamp(2.45rem,4vw,3.55rem)}
}
@media(max-width:800px){
  .hero-copy h1{font-size:clamp(2.35rem,8vw,3.35rem)}
}
@media(max-width:560px){
  .hero-copy h1{font-size:clamp(2.2rem,9.5vw,3rem)}
}
</style>
</head>
