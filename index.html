<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Behzad Nazarbakhsh — Software Craftsmanship, Product Coaching, Agile and IT Management.">
  <title>Behzad Nazarbakhsh | Professional Hub</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
<style>
/* Homepage hero — consolidated final layout */
.hero{
  min-height:94vh;
  padding-top:96px;
  padding-bottom:70px;
  background:
    radial-gradient(circle at 82% 42%,rgba(218,228,220,.72) 0,transparent 31%),
    linear-gradient(135deg,#fafbf8 0%,#eef2ed 100%);
}
.hero-grid{
  grid-template-columns:minmax(0,1fr) minmax(500px,.9fr);
  gap:34px;
  min-height:76vh;
  align-items:center;
}
.hero-copy{max-width:690px;padding-bottom:10px}
.hero-identity{
  margin:0 0 22px;
  font-family:"DM Mono",monospace;
  font-size:.70rem;
  font-weight:500;
  letter-spacing:.09em;
  color:var(--ink);
  text-transform:uppercase;
}
.hero-identity span{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:.68rem;
  letter-spacing:.015em;
  text-transform:none;
}
.hero-copy h1{
  max-width:570px;
  font-size:clamp(2.55rem,3.55vw,3.9rem);
  line-height:1.06;
  letter-spacing:-.032em;
}
.hero-copy h1 em{display:inline-block;color:var(--ink)}
.hero-copy .intro{
  max-width:540px;
  margin-top:22px;
  margin-bottom:26px;
  font-size:.96rem;
  line-height:1.72;
}
.hero-copy .actions{margin-top:4px}
.hero-copy .button{
  padding:10px 16px;
  font-size:.73rem;
}
.hero-mark{
  justify-self:center;
  width:100%;
  transform:translateY(0);
}
.hero-thinking-map{margin:auto}

@media(max-width:1050px){
  .hero-grid{grid-template-columns:minmax(0,1fr) minmax(430px,.85fr);gap:12px}
  .hero-copy h1{font-size:clamp(2.45rem,4vw,3.55rem)}
}
@media(max-width:800px){
  .hero{min-height:auto;padding-top:90px;padding-bottom:65px}
  .hero-grid{grid-template-columns:1fr;gap:15px;min-height:auto}
  .hero-copy{max-width:700px}
  .hero-copy h1{font-size:clamp(2.35rem,8vw,3.35rem)}
  .hero-copy .intro{font-size:.95rem}
  .hero-mark{justify-self:center;margin-top:24px}
}
@media(max-width:560px){
  .hero{padding-top:82px}
  .hero-copy h1{font-size:clamp(2.2rem,9.5vw,3rem)}
  .hero-identity{font-size:.65rem}
  .hero-identity span{font-size:.63rem}
  .hero-copy .intro{font-size:.92rem}
  .hero-mark{margin-top:12px}
}
</style>
</head>
<body>
  <header id="home" class="hero">
    <nav class="nav">
      <a class="brand" href="#">BN</a>
      <div class="nav-links">
        <a href="#home">Home</a><a href="#services">Services</a><a href="#work">Contribution</a><a href="#articles">Knowledge Base</a><a href="#about-contact">About</a>
      </div>
    </nav>
